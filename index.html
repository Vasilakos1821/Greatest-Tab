<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <!-- Top-Left Clock Style Switcher -->
      <nav class="clock-mode-toggle" aria-label="Clock Display Format">
        <button id="btn-digital" class="toggle-btn active" type="button">24H</button>
        <button id="btn-analog" class="toggle-btn" type="button">Analog</button>
      </nav>

      <!-- Top-Right Controls: Sticky Notes & Wallpaper -->
      <div class="top-controls-right">
        <button id="btn-add-note" class="control-btn note-btn" type="button" title="Create a new sticky note">
          ➕ Note
        </button>

        <input type="file" id="wallpaper-input" accept="image/*" hidden />
        <button id="btn-upload-wallpaper" class="control-btn" type="button" title="Upload Custom Wallpaper">
          🖼️ Wallpaper
        </button>

        <label class="space-switch" title="Automatically set NASA's daily space photo as your wallpaper">
          <input type="checkbox" id="toggle-auto-space" />
          <span class="switch-slider"></span>
          <span class="switch-label">Daily Space Wallpaper</span>
        </label>

        <button id="btn-reset-wallpaper" class="control-btn hidden" type="button" title="Reset to Default Background">
          ✕
        </button>
      </div>

      <!-- Container for Dynamic Multiple Draggable Sticky Notes -->
      <div id="notes-container"></div>

      <!-- Center Content: Clocks, Search, Shortcuts -->
      <main class="center-content">
        <!-- Digital 24H Display -->
        <div id="digital-clock" class="digital-container">
          <div id="clock" class="clock-digits">00:00:00</div>
          <div id="current-date" class="date-digits"></div>
        </div>

        <!-- iPhone-style Circle Analog Display with 1-12 Numbers -->
        <div id="analog-clock" class="analog-container hidden">
          <div class="analog-face">
            <div class="clock-number" style="--i: 12"><span>12</span></div>
            <div class="clock-number" style="--i: 1"><span>1</span></div>
            <div class="clock-number" style="--i: 2"><span>2</span></div>
            <div class="clock-number" style="--i: 3"><span>3</span></div>
            <div class="clock-number" style="--i: 4"><span>4</span></div>
            <div class="clock-number" style="--i: 5"><span>5</span></div>
            <div class="clock-number" style="--i: 6"><span>6</span></div>
            <div class="clock-number" style="--i: 7"><span>7</span></div>
            <div class="clock-number" style="--i: 8"><span>8</span></div>
            <div class="clock-number" style="--i: 9"><span>9</span></div>
            <div class="clock-number" style="--i: 10"><span>10</span></div>
            <div class="clock-number" style="--i: 11"><span>11</span></div>

            <div class="hand hour-hand" id="hour-hand"></div>
            <div class="hand minute-hand" id="minute-hand"></div>
            <div class="hand second-hand" id="second-hand"></div>
            <div class="center-nut"></div>
          </div>
          <div id="analog-date" class="date-digits"></div>
        </div>

        <!-- Google Search Bar -->
        <form class="search-form" action="https://www.google.com/search" method="GET" target="_self">
          <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 14z"/>
          </svg>
          <input 
            type="text" 
            name="q" 
            placeholder="Search Google..." 
            autocomplete="off" 
            spellcheck="false" 
            autofocus 
            required 
          />
        </form>

        <!-- 5 Draggable Shortcut Slots -->
        <div class="shortcuts-grid" id="shortcuts-grid"></div>
      </main>

      <!-- Shortcut Modal -->
      <div class="modal-overlay hidden" id="shortcut-modal">
        <div class="modal-card">
          <h3 id="modal-title">Edit Shortcut</h3>
          <form id="shortcut-form">
            <label for="shortcut-name-input">Name</label>
            <input type="text" id="shortcut-name-input" placeholder="e.g. YouTube" required autocomplete="off" />

            <label for="shortcut-url-input">URL</label>
            <input type="url" id="shortcut-url-input" placeholder="https://..." required autocomplete="off" />

            <div class="modal-actions">
              <button type="button" id="modal-delete-btn" class="btn-danger">Clear Slot</button>
              <div class="right-actions">
                <button type="button" id="modal-cancel-btn" class="btn-secondary">Cancel</button>
                <button type="submit" class="btn-primary">Save</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Bottom Dock: Tabs for Spotify & NASA Space Photo -->
      <section class="bottom-dock" id="bottom-dock">
        <div class="dock-tabs">
          <button class="dock-tab-btn" id="tab-btn-spotify" type="button">
            <span>🎵 Spotify</span>
            <span class="tab-indicator">▲</span>
          </button>
          <button class="dock-tab-btn" id="tab-btn-space" type="button">
            <span>🔭 NASA Space Photo</span>
            <span class="tab-indicator">▲</span>
          </button>
        </div>

        <div class="dock-drawer-content" id="dock-drawer-content">
          <!-- Spotify Panel with Volume Slider & Login Link -->
          <div class="dock-panel hidden" id="panel-spotify">
            <div class="spotify-controls">
              <input type="text" id="spotify-url-input" placeholder="Paste Spotify Track / Album / Playlist link..." autocomplete="off" />
              <button id="btn-load-spotify" type="button" class="btn-dock-action">Load</button>
              <button id="btn-default-spotify" type="button" class="btn-dock-secondary" title="Reset to default lofi playlist">Reset</button>
              
              <!-- Volume Slider Control -->
              <div class="spotify-volume-control" title="Volume Control">
                <span class="volume-icon">🔊</span>
                <input type="range" id="spotify-volume-slider" min="0" max="100" value="80" />
                <span id="volume-val">80%</span>
              </div>

              <a href="https://accounts.spotify.com/login" target="_blank" rel="noopener noreferrer" class="btn-dock-login" title="Log in to Spotify in your browser for full song playback">
                🔑 Log In
              </a>
            </div>
            <div class="spotify-frame-container">
              <iframe 
                id="spotify-iframe" 
                src="https://open.spotify.com/embed/playlist/37i9dQZF1DXdLEN7aqioXM?utm_source=generator&theme=0" 
                width="100%" 
                height="152" 
                frameborder="0" 
                allowfullscreen="" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                loading="lazy">
              </iframe>
            </div>
          </div>

          <!-- NASA Daily Space Photo Panel -->
          <div class="dock-panel hidden" id="panel-space">
            <div class="drawer-body" id="drawer-body">
              <p class="status-msg">Loading space snapshot...</p>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
